name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Tests use assert(), so they must run in Debug: Release defines
          # NDEBUG and every check would be compiled out.
          - name: Linux GCC (Debug)
            os: ubuntu-latest
            cxx: g++
            build_type: Debug
            sanitizers: OFF
          - name: Linux Clang (Debug)
            os: ubuntu-latest
            cxx: clang++
            build_type: Debug
            sanitizers: OFF
          - name: Linux GCC (ASan + UBSan)
            os: ubuntu-latest
            cxx: g++
            build_type: Debug
            sanitizers: ON
          - name: macOS Apple Clang (Debug)
            os: macos-latest
            cxx: clang++
            build_type: Debug
            sanitizers: OFF

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DMATRIX_ENABLE_SANITIZERS=${{ matrix.sanitizers }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        working-directory: build
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --output-on-failure

  release-build:
    name: Release build (compile check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++

      - name: Build
        run: cmake --build build --parallel
